name: angkor_prim
description: ANGKOR PRIM - video & music player with background playback.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  youtube_explode_dart: ^3.0.0
  just_audio: '>=0.9.40 <0.11.0'
  just_audio_background: '>=0.0.1-beta.11 <0.0.2'
  video_player: ^2.9.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#14110D"
  adaptive_icon_foreground: assets/icon_fg.png
  min_sdk_android: 21
