name: Build ANGKOR PRIM APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First-time setup: the project source is uploaded as one packed file
      # (bootstrap/project.tgz.b64). Unpack it into the repo and commit it.
      - name: Unpack project (first run only)
        run: |
          if [ -f bootstrap/project.tgz.b64 ]; then
            base64 -d bootstrap/project.tgz.b64 | tar xz
            git rm -q -r bootstrap
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Add ANGKOR PRIM source" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_011VyubhdWjfBd87fZiwnSm5"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate app icons
        run: |
          pip install pillow
          python3 tool/make_icons.py

      - name: Prepare Android project
        run: bash tool/setup_android.sh

      - name: Get packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/ANGKOR-PRIM-${{ github.run_number }}.apk"

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ANGKOR-PRIM-apk
          path: out/*.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ANGKOR PRIM build ${{ github.run_number }}
          files: out/*.apk
