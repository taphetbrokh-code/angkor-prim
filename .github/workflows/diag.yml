name: Diagnose YouTube streams

on:
  push:
    paths: ['tool/diag.dart', '.github/workflows/diag.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Run diagnostic
        run: timeout 900 dart run tool/diag.dart || true
      - name: Save result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase || true
          git add -f diag-result.txt
          git commit -q -m "Diagnostic result [skip ci]" || true
          git push || true
